name = "notghostingyou-api"
main = "src/index.js"
compatibility_date = "2024-09-25"

# Routes: serve the API at api.notghostingyou.xyz (add a DNS record + this route
# in the Cloudflare dashboard, or use the workers.dev subdomain below).
# workers.dev subdomain is auto-provisioned on first deploy if no custom route.

# ── D1: bids + history (SQLite at the edge) ──────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "btd-bids"
database_id = "9a1c73a3-6fb3-4ade-907d-e72dc6617c60"

# ── Secrets (set via `npx wrangler secret put <NAME>`) ───────────────────
# STRIPE_SECRET_KEY      — sk_live_… or sk_test_…
# RESEND_API_KEY         — re_…  (outbid email alerts; optional)
# FROM_EMAIL             — e.g. "Brand the Device <auction@notghostingyou.xyz>"
# OWNER_EMAIL            — where new-bid notifications go (founder admin)
# AUTH_TOKEN             — shared secret for founder-admin endpoints (/admin/*)

[vars]
# Publishable values (safe to commit). Secrets go above, never here.
STRIPE_PUBLISHABLE = "pk_test_51UA1WNHMepf4cgbYy2mrDGafo9rB5BZ1RamPvqrKSWkiLWSuy0BY2FN3e3LrneU8hsWqY3ueTn2xlt3TvdXhjw0j00ORy68eLH"
CORS_ORIGIN = "https://notghostingyou.xyz"
AUCTION_CLOSE = "2026-09-30T20:00:00Z"
DEPOSIT_PCT = 20            # % of bid held as refundable deposit
CURRENCY = "aud"
